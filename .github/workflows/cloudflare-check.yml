name: Cloudflare Worker validation

on:
  push:
    branches:
      - backup/pre-cloudflare-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Build Next.js for Cloudflare Workers
        run: bun run cf:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Run the broader legacy suite after the deployment build so stale test
      # fixtures cannot prevent us from seeing whether the Cloudflare build works.
      - name: Run automated tests
        run: bun test
