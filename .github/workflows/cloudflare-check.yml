name: Cloudflare Worker validation

on:
  push:
    branches:
      - backup/pre-cloudflare-migration
      - fix/runtime-stability-backup-20261128
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit duplicate and outdated image/model assets
        run: bun run assets:audit

      - name: TypeScript check
        run: bun run lint

      - name: Build Next.js for Cloudflare Workers
        run: bun run cf:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run Cloudflare compatibility tests
        run: bun test lib/server/workers-compat.test.ts lib/server/bgm-manifest.test.ts
