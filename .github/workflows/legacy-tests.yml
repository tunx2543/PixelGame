name: Legacy full test suite

on:
  push:
    branches:
      - backup/pre-cloudflare-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full automated test suite
        run: bun test
